agent_name: "qwen3.6-27b"
# NOTE: confirm the exact HuggingFace repo id for this model.
model_name: "Qwen/Qwen3.6-27B"
enable_thinking: false
vllm: true
max_new_tokens: 2048

# vLLM init knobs (consumed by MemoryAgentPrompting in agent_prompting.py).
# 2x H100 80GB node -> shard the 27B dense model across both GPUs.
tensor_parallel_size: 1
gpu_memory_utilization: 0.9
# Hybrid Mamba/attention (Qwen3-Next) models hang/stall in torch.compile +
# CUDA-graph capture on multi-GPU. enforce_eager skips that phase for a fast,
# reliable startup. Set to false later if you want the compiled speedup.
enforce_eager: true
# max_model_len: 32768   # uncomment to cap context if you hit OOM on long inputs

infer_with_full_memory: true
external_model_url: http://127.0.0.1:5005/batch_process
api_key: EMPTY
