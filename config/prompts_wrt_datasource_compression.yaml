unified_prompt: "Remember the following content chunk by completing these steps:\n\n1. **Core Memory Update**: Maintain an understanding of the user, or a summary of what the user is reading, or a set of classification rules summarized from the classification examples (label 1: meaning; label 2: meaning, etc.). Keep updates brief (a few sentences maximum).\n\n2. **Memory Storage**:\n   - **Episodic Memory**: Record user actions, user's friends' actions and assistant actions with timestamps (format: \"At timestamp t, user did X\")\n   - **Semantic Memory**: Record key facts and information (format: \"John is User's 18-year-old friend\", \"Harry Potter author: J.K. Rowling\", \"Sample: xxx; Label: xxx\")\n\n<new_chunk>\n{context}\n</new_chunk>\n\n**Important**: Response limit is {max_new_tokens} tokens. {compression_instruction}"

unified_prompt_multispeaker: "Remember the following multi-speaker conversation chunk by completing these steps:\n\nThe conversation involves multiple speakers identified by <speaker_name> tags (e.g., <sheldon_cooper>, <leonard_hofstadter>). Pay close attention to WHO says or does WHAT.\n\n1. **Core Memory Update**: Maintain a summary of the conversation participants, their relationships, and the overall context of the conversation so far. Keep updates brief (a few sentences maximum).\n\n2. **Memory Storage**:\n   - **Episodic Memory**: Record specific actions, statements, or events with speaker attribution and timestamps (format: \"At timestamp t,, speaker_name did X\",  - **Semantic Memory**: Record key facts about speakers, their traits, relationships, preferences, and referenced knowledge (format: \"sheldon_cooper is leonard_hofstadter's roommate\", \"leonard_hofstadter is a physicist\", \"sheldon_cooper has a sister who works at Fuddruckers\")\n\n<new_chunk>\n{context}\n</new_chunk>\n\n**Important**: Response limit is {max_new_tokens} tokens. {compression_instruction}"

unified_prompt_multispeaker_anon: "Remember the following multi-speaker conversation chunk by completing these steps:\n\nThe speakers are labeled with ANONYMOUS tags like <Speaker0>, <Speaker1>. These are NOT real names. The SAME tag refers to the SAME person across ALL chunks; a real name (if any) must be INFERRED from what is said. Never assume a tag is a name.\n\n**Name-inference rules (most reliable first):**\n- SELF-INTRO: a speaker says \"I'm Penny\" -> that speaker = Penny (strongest).\n- VOCATIVE: a speaker addresses someone by name -> the name belongs to the ADDRESSEE, NOT to the speaker who said it. Example: <Speaker1> \"Leonard, help me\" => Speaker0 (the person spoken to) = Leonard, NOT Speaker1.\n- Only use names that appear LITERALLY in the text. Never invent or guess a name.\n\n1. **Speaker Registry (Core Memory)**: Maintain, at the TOP of core memory, a block in EXACTLY this format, one line per tag seen so far:\n[Speaker Registry]\nSpeaker0 = <Name or UNKNOWN> [confirmed|candidate|unknown] (cues: <short note>)\nSpeaker1 = ...\n[End Registry]\nReproduce the WHOLE block verbatim every time you update core, editing only changed lines. Assign a real name only on direct evidence; weak/indirect cues -> keep UNKNOWN. Every name is PROVISIONAL: if a later chunk gives stronger evidence for a different name, OVERWRITE that line. Mark [confirmed] only after a self-intro or >=2 consistent strong cues; otherwise [candidate].\n\n2. **Core Memory Update**: After the registry block, keep a brief summary of participants, relationships, and context.\n\n3. **Memory Storage** — attribute EVERY fact to the STABLE tag (SpeakerX), NOT the guessed name, so facts stay correct even if the name is later revised:\n   - **Episodic Memory**: \"At timestamp t, Speaker0 did X\"\n   - **Semantic Memory**: \"Speaker0 is Speaker1's roommate\", \"Speaker0 is a physicist\"\n\n<new_chunk>\n{context}\n</new_chunk>\n\n**Important**: Response limit is {max_new_tokens} tokens. {compression_instruction}"

# Audio-native variant of `unified_prompt_multispeaker`: the chunk is delivered as an
# AUDIO recording (the {context} placeholder is replaced by the model's audio
# placeholder token, not by text) together with its session metadata. Used by
# run_memory_construction_audio.py with a Qwen3-Omni agent config. Same
# {max_new_tokens} / {compression_instruction} placeholders as the text prompts, plus
# {timestamp} (session date), {conv_id} and the chunk's {start_sec}/{end_sec} offsets.
unified_prompt_multispeaker_audio: "Listen to the following multi-speaker conversation recording and remember it by completing these steps:\n\n**Recording metadata**\n- Session date: {timestamp}\n- This excerpt covers {start_sec}-{end_sec} (in seconds) of the recording.\n\nYou receive AUDIO ONLY — there is no transcript. Transcribe it internally, separate the speakers by voice, and pay close attention to WHO says or does WHAT. Also use what only audio can tell you (tone, emotion, laughter, hesitation, overlapping speech, background sounds) when it carries meaning.\n\n**Speaker naming rules (most reliable first):**\n- SELF-INTRO: a voice says \"I'm Penny\" -> that speaker = Penny (strongest).\n- VOCATIVE: a voice addresses someone by name -> the name belongs to the ADDRESSEE, NOT to the speaker who said it.\n- Use ONLY names actually spoken in this recording. Never invent or guess a name.\n- If a speaker's name is not established, refer to them with a chunk-local label plus a short voice descriptor, e.g. \"Speaker A (adult male, low voice)\". Say explicitly that the label is local to this recording, because labels are NOT guaranteed to match other recordings; whenever a real name IS established, prefer it, since names are what carry across sessions.\n\n1. **Core Memory Update**: Maintain a summary of the conversation participants, their names once known, their relationships, and the overall context so far. Keep updates brief (a few sentences maximum).\n\n2. **Memory Storage**:\n   - **Episodic Memory**: Record specific actions, statements or events with speaker attribution and a timestamp combining the session date and the position within this recording (format: \"On {timestamp} at mm:ss into the recording, <speaker> did X\").\n   - **Semantic Memory**: Record key facts about the speakers, their traits, relationships, preferences, and referenced knowledge (format: \"<speaker> is <speaker>'s roommate\", \"<speaker> is a physicist\").\n\n3. **Do NOT transcribe the recording turn by turn.** Memory is a summary, not a transcript: merge related turns into one item and skip small talk, back-channels and repetition.\n\n<new_chunk>\n{context}\n</new_chunk>\n\n**Important**: Response limit is {max_new_tokens} tokens. {compression_instruction} HARD LIMIT: emit AT MOST {max_memory_calls} function calls in total for this recording. Choose the {max_memory_calls} most memory-worthy facts, then stop and write Done."

# History-aware audio experiment. `history_context` contains zero or more labelled audio
# placeholders for preceding chunks; `context` is the final placeholder and always maps
# to the current chunk. Only information newly stated in the current chunk may be written.
unified_prompt_multispeaker_audio_history: |
  Listen to the CURRENT multi-speaker conversation recording and remember only the new information in it.

  You receive AUDIO ONLY. Before the current recording, you may receive several REFERENCE HISTORY recordings. The history is context only: use it to recognize recurring voices, resolve names, relationships, pronouns, and references needed to understand the current recording.

  STRICT MEMORY BOUNDARY:
  - Create, update, or delete memory ONLY because of information stated or revealed in the CURRENT recording.
  - NEVER summarize, copy, or create memory from a REFERENCE HISTORY recording.
  - A fact heard only in history is not a new fact and must not trigger a memory call.
  - You may use history to identify who is speaking now. If a current speaker matches a named person in history, use that name when storing what the person says or does in the CURRENT recording.
  - Before every memory call, verify that its stored content describes the CURRENT recording. Existing core memory may be updated only with changes supported by the current recording.

  **Reference history recordings — context only, do not summarize or store them**
  {history_context}

  **CURRENT RECORDING — this is the only recording to summarize and store**
  - Session date: {timestamp}
  - Current excerpt: {start_sec}-{end_sec} seconds
  {context}

  Pay close attention to WHO says or does WHAT in the current recording. Use meaningful audio evidence such as tone, emotion, laughter, hesitation, overlapping speech, and background sounds.

  **Speaker naming rules:**
  - A self-introduction in the current or history audio is strong identity evidence.
  - A vocative names the addressee, not the person saying the name.
  - Use only names actually spoken in the supplied audio or already present in memory; never invent a name.
  - Compare voices in the reference recordings with voices in the current recording. When confident that a current voice belongs to a person already represented in memory, reuse that person's exact existing name or identifier.
  - Never reuse Speaker A/B merely because someone speaks first or second; speaking order can change between recordings.
  - If identity remains unknown or uncertain, use a current-chunk label with a short voice description, such as "Current Speaker A (adult male, low voice)," and do not claim it is the same person as a history speaker.

  1. **Core Memory Update**: Briefly update participants, relationships, and overall context, but only where the current recording adds or changes information.
  2. **Memory Storage**:
     - **Episodic Memory**: Store important current actions, statements, or events with speaker attribution and time: "On {timestamp} at mm:ss into the recording, <speaker> did X".
     - **Semantic Memory**: Store important facts newly stated or revealed in the current recording.
  3. **Do NOT transcribe any recording turn by turn.** Merge related current turns and skip small talk, back-channels, and repetition.

  **Important**: Response limit is {max_new_tokens} tokens. {compression_instruction} HARD LIMIT: emit AT MOST {max_memory_calls} function calls in total for the CURRENT recording. Choose the {max_memory_calls} most memory-worthy CURRENT facts, then stop and write Done.

# Compression strategies for ablating the memory compression ratio.
#
# The control variable is a COMPRESSION RATE, as in the prompt-compression literature
# (LLMLingua's budget controller, arXiv:2310.05736; CR adherence, arXiv:2511.12281) --
# NOT an absolute per-item size. Each strategy sets:
#
#   * target_ratio -> the per-chunk memory budget is that chunk's own word count divided
#                     by target_ratio, computed at runtime and substituted into the
#                     {memory_budget_words} placeholder of `instruction`. Because every
#                     chunk gets the same FRACTION, the budgets sum to
#                     total_input / target_ratio, so the global compression ratio is
#                     controlled by construction -- independent of chunk length, chunk
#                     count and dataset. An absolute word cap would instead make the
#                     achieved ratio float with chunk size (25 words is ~4x on a
#                     500-token chunk but ~40x on a 4k-token chunk).
#                     Omit target_ratio to keep a prose-only strategy.
#   * instruction  -> injected as {compression_instruction} at the END of the unified
#                     prompts above (strongest position, so it can override them).
#   * budget_ratio -> multiplies agent_config.max_new_tokens to give the HARD per-chunk
#                     output cap. SAFETY NET ONLY -- keep it above the natural output
#                     length. When it binds, generation is cut mid-JSON and the truncated
#                     call is dropped (agent.py::_run_tool_from_function_call), which
#                     loses writes rather than compressing them.
#
# The budget covers episodic/semantic content only; CORE memory is exempt, because it is
# rewritten (not appended) and, in the _anon prompt, carries the Speaker Registry that has
# to be reproduced every chunk. Budgeting the number of tool calls would starve it.
#
# Names are nominal targets; the ACHIEVED ratio in compression.json is what to report --
# LLMs adhere to a requested rate only approximately (arXiv:2511.12281).
compression_strategies:
  default:
    instruction: "Be concise and brief in all memory updates"
    budget_ratio: 1.0
  x2:
    target_ratio: 2
    instruction: "Compression budget for this chunk: store AT MOST {memory_budget_words} words of new episodic+semantic memory in total (core memory updates are exempt, but keep them brief). Split that budget across as many or as few memory items as you like. Record the important facts and actions, merging closely related details and dropping filler and small talk. Keep names, dates and numbers verbatim. Never emit an unfinished call."
    budget_ratio: 1.0
  x3:
    target_ratio: 3
    instruction: "Compression budget for this chunk: store AT MOST {memory_budget_words} words of new episodic+semantic memory in total (core memory updates are exempt, but keep them brief). Split that budget across as many or as few memory items as you like. Store only the key facts and main events; merge related details and skip minor or redundant information. If the chunk refines something already in your memory, prefer memory_update over new_memory_insert. Keep names, dates and numbers verbatim. Never emit an unfinished call."
    budget_ratio: 0.8
  x4:
    target_ratio: 4
    instruction: "Compression budget for this chunk: store AT MOST {memory_budget_words} words of new episodic+semantic memory in total (core memory updates are exempt, but keep them brief). Split that budget across as many or as few memory items as you like. Keep only the essential facts and outcomes; aggressively merge related details and drop supporting or redundant ones. Do NOT store the same content as both a semantic and an episodic item. If the chunk refines something already in your memory, prefer memory_update over new_memory_insert; if it adds no fact a later question could depend on, emit no episodic/semantic write at all. Keep names, dates and numbers verbatim; drop narration and phrasing. Never emit an unfinished call."
    budget_ratio: 0.6
  x5:
    target_ratio: 5
    instruction: "Compression budget for this chunk: store AT MOST {memory_budget_words} words of new episodic+semantic memory in total (core memory updates are exempt, but keep them brief). Split that budget across as many or as few memory items as you like. Store only the few most essential facts and outcomes; heavily summarize and merge. Do NOT store the same content as both a semantic and an episodic item. If the chunk refines something already in your memory, prefer memory_update over new_memory_insert; if it adds no fact a later question could depend on, emit no episodic/semantic write at all. Keep names, dates and numbers verbatim; drop narration and phrasing. Never emit an unfinished call."
    budget_ratio: 0.5
  x6:
    target_ratio: 6
    instruction: "Compression budget for this chunk: store AT MOST {memory_budget_words} words of new episodic+semantic memory in total (core memory updates are exempt, but keep them brief). That is a very small budget -- spend it only on what a later question could not be answered without. Write terse fact fragments, not sentences: no articles, no narration, no phrasing, no restating the situation. Do NOT store the same content as both a semantic and an episodic item. Prefer memory_update on an existing item over new_memory_insert, and write nothing at all for chunks that add no new fact. Keep names, dates and numbers verbatim -- compress everything else. Never emit an unfinished call."
    budget_ratio: 0.5
  x8:
    target_ratio: 8
    instruction: "Compression budget for this chunk: store AT MOST {memory_budget_words} words of new episodic+semantic memory in total (core memory updates are exempt, but keep them brief). This budget is far too small to describe the chunk, so do not try: record only the single most load-bearing fact, as a bare fragment (e.g. 'Lindsay + Linh: Shanghai Film Festival, 1993-06-15'). Expect to write NOTHING for many chunks -- that is the correct behaviour when nothing new and essential appeared. Prefer memory_update on an existing item over new_memory_insert. Keep names, dates and numbers verbatim; drop every other word. Never emit an unfinished call."
    budget_ratio: 0.5

