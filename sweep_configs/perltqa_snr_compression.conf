# PerLTQA bundle 0: SNR x compression sweep.
#
# Run all 15 jobs (3 audio conditions x 5 compression settings):
#   bash submit_sweep.sh sweep_configs/perltqa_snr_compression.conf
#
# Format per entry:
#   name|parquet_path|dataset|qa_dir|space-separated compression ratios
#
# Ratios can differ by condition. "none" is the uncompressed baseline.
SNR5_RATIOS="x3 x5 x8"
SNR0_RATIOS="x3 x5 x8"

SWEEP_CASES=(
  "interf_SNR5_bundle0|outputs/step3_perltqa_replaced_name_interf_SNR5/bundle_0/dataset_pred_name_bundle_0_perltqa_interf_SNR5.parquet|perltqa|outputs/perltqa_data/qa_multi_name_replaced/bundle_0_filterd/|${SNR5_RATIOS}"
  "interf_SNR0_bundle0|outputs/step3_perltqa_replaced_name_interf_SNR0/bundle_0/dataset_pred_name_bundle_0_perltqa_interf_SNR0.parquet|perltqa|outputs/perltqa_data/qa_multi_name_replaced/bundle_0_filterd/|${SNR0_RATIOS}"
)

# One deterministic/greedy run per case and ratio. To add sampled replications:
# SEEDS=("" 1 2)
# MEM_TEMPERATURE="0.3"
SEEDS=("")
