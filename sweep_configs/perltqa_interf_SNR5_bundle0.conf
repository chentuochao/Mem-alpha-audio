# =============================================================================
# Sweep config for submit_sweep.sh  (this file is `source`d as bash).
#   bash submit_sweep.sh sweep_configs/perltqa_interf_SNR0_bundle0.conf
#
# Mirrors the manual run:
#   bash run_pipeline.sh \
#     outputs/step3_perltqa_replaced_name_interf_SNR0/bundle_0/dataset_pred_name_bundle_0_perltqa_interf_SNR0.parquet \
#     perltqa \
#     outputs/perltqa_data/GPT-5.6_perltqa_bundles/hundle0/
#
# One config == ONE (parquet, qa_dir) pair == one bundle. Copy this file per
# bundle (bundle_1 -> hundle1, bundle_2 -> hundle2) to fan those out too.
# =============================================================================

# --- required --------------------------------------------------------------
# NOTE: on disk the folder is "step3_perltqa_replaced_name_interf_SNR0" and the
# parquet is "..._perltqa_interf_SNR0.parquet" (not the shorter name from the
# manual command, which does not exist).
PARQUET_PATH="outputs/step3_perltqa_replaced_name_interf_SNR5/bundle_0/dataset_pred_name_bundle_0_perltqa_interf_SNR5.parquet"

# PerLTQA-specific: dataset selector + free-form QA dir (note the "hundle" spelling
# is the real folder name on disk).
DATASET="perltqa"
CUSTOM_QA_DIR="outputs/perltqa_data/qa_multi_name_replaced/bundle_0_filterd/"

# Compression ratios to sweep -- one SLURM job per entry.
# Valid keys come from config/prompts_wrt_datasource_compression.yaml.
# "none" == the baseline run with no compression flag (no _comp_ postfix).
# COMPRESSION_RATIOS=("none")
# e.g. COMPRESSION_RATIOS=("none" "x3" "x4")
COMPRESSION_RATIOS=("x2" "x3" "x4" "x5")
# --- optional: seed-variance sweep -----------------------------------------
# Cartesian product ratios x seeds -> one SLURM job each.
#
# An EMPTY-STRING entry ("") means "no seed override" -> a GREEDY baseline run
# (temperature 0.0, default .../0 folder), identical to the plain run_pipeline.sh
# command. Non-empty entries are seeded runs sampled at MEM_TEMPERATURE, each in
# its own .../seed<N>/0 subfolder.
#
# So this line = 1 greedy baseline + 3 seeded runs (temp 0.3) = 4 SLURM jobs.
# MEM_TEMPERATURE > 0 is REQUIRED whenever any seed is non-empty (greedy decoding
# ignores the seed); submit_sweep.sh refuses the sweep otherwise.
SEEDS=("")
MEM_TEMPERATURE="0.3"

# --- optional: force QA re-answer ------------------------------------------
# Default (unset) -> QA is NOT re-answered when results.json already exists (the
# existing answers are reused). Set to 1/true to force re-answering every
# question and overwrite results.json. NOTE: step 1 memory construction is always
# skipped when agent_state.json already exists, regardless of this flag.
# FORCE_REANSWER=1

# --- optional server overrides (uncomment to change) -----------------------
# VLLM_SCRIPT="./launch_vllm.sh"
# VLLM_ENV="vllm"
# MEM_ENV="mem"
