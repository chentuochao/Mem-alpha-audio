# =============================================================================
# Sweep config for submit_sweep.sh  (this file is `source`d as bash).
#
#   bash submit_sweep.sh sweep_configs/Friends_S01_anony.conf
#
# Friends Season01, pseudonymized speaker names (Adrian Mercer, Clara Bennett,
# ...). Built from outputs/step3_anony/Friends via
# prepare_data/prepare_parquet_from_step3.py with the Friends session timeline.
#
# NOTE: use the *pred* parquet. The QA options are pseudonyms, which appear only
# in parsed_dialog_pred.json; dataset_gt_name_*.parquet carries the real names
# (monica_geller, ...) and would fail every Named Attribution question.
# =============================================================================

# --- required --------------------------------------------------------------
PARQUET_PATH="./outputs/step3_anony/Friends/dataset_pred_name_Season01_Anony.parquet"

# One SLURM job per entry. "none" = baseline, no compression flag.
COMPRESSION_RATIOS=("none")

# --- optional: seed-variance sweep -----------------------------------------
SEEDS=(None)
# REQUIRED > 0 if you sweep real seeds; the default config decodes greedily.
MEM_TEMPERATURE="0.3"

# --- optional (defaults shown) ---------------------------------------------
DATASET="seamlessinteraction_options"
CUSTOM_QA_DIR="outputs/step3_anony/Friends_Anony_QA/"

# --- optional server overrides (uncomment to change) -----------------------
# VLLM_SCRIPT="./launch_vllm_qwen36.sh"
# VLLM_ENV="vllm"
# MEM_ENV="mem"
