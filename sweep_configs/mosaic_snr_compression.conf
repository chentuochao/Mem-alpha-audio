# Mosaic bundle 0: SNR x compression sweep.
#
# Run all 15 jobs (3 audio conditions x 5 compression settings):
#   bash submit_sweep.sh sweep_configs/mosaic_snr_compression.conf
#
# Format per entry:
#   name|parquet_path|dataset|qa_dir|space-separated compression ratios
#
# Ratios can differ by condition. "none" is the uncompressed baseline.
# CLEAN_RATIOS="none x2 x3 x4 x5"
SNR10_RATIOS="x2 x4 x6 x8"
SNR5_RATIOS="x2 x4 x6 x8"

SWEEP_CASES=(
  "interf_SNR10_bundle0|outputs/mosaic_step3_interf_SNR10/bundle_0/dataset_pred_name_bundle_0_mosaic_interf_SNR10.parquet|seamlessinteraction_options|outputs/mosaic_step3/QA/bundle0/|${SNR10_RATIOS}"
  "interf_SNR5_bundle0|outputs/mosaic_step3_interf_SNR5/bundle_0/dataset_pred_name_bundle_0_mosaic_interf_SNR5.parquet|seamlessinteraction_options|outputs/mosaic_step3/QA/bundle0/|${SNR5_RATIOS}"
)

# One deterministic/greedy run per case and ratio. To add sampled replications:
# SEEDS=("" 1 2)
# MEM_TEMPERATURE="0.3"
SEEDS=("")
