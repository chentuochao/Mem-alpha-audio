# =============================================================================
# Sweep config for submit_sweep.sh  (this file is `source`d as bash).
# Copy this to e.g. sweep_configs/season1.conf and edit.
#
#   bash submit_sweep.sh sweep_configs/season1.conf
# =============================================================================

# --- required --------------------------------------------------------------
PARQUET_PATH="./outputs/step3_anony/S01_S03_Clean_Anoy_anon_global/dataset_pred_name_anon_global_Season01_Clean.parquet"

# Compression ratios to sweep -- one SLURM job per entry.
# Valid keys come from config/prompts_wrt_datasource_compression.yaml.
# Use "none" for the baseline run with no compression flag (no _comp_ postfix).
# COMPRESSION_RATIOS=("none" "x1.5" "x2" "x3" "x5")
# COMPRESSION_RATIOS=("none" "x3" "x4" )   # or several ratios
COMPRESSION_RATIOS=("none")   # or several ratios

# --- optional: seed-variance sweep -----------------------------------------
# Seeds to run per compression ratio (cartesian product ratios x seeds -> one
# SLURM job each). Leave unset/empty for a single run with no seed override.
# Each seed writes to its own _rollout_seed<N> folder so nothing is overwritten.
SEEDS=(1 2 10)
#
# REQUIRED for seeds to actually diverge: the default config decodes greedily
# (temperature 0.0) and ignores the seed. Set a positive temperature so runs
# differ. submit_sweep.sh refuses a SEEDS sweep unless this is > 0.
MEM_TEMPERATURE="0.3"

# --- optional (defaults shown) ---------------------------------------------
DATASET="seamlessinteraction_options"
CUSTOM_QA_DIR="outputs/step3_anony/qas/"

# --- optional server overrides (uncomment to change) -----------------------
# VLLM_SCRIPT="./launch_vllm_qwen36.sh"
# VLLM_ENV="vllm"
# MEM_ENV="mem"
